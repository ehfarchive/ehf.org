<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EHF route progress</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17211d;
        --muted: #65716b;
        --line: #d9dedb;
        --paper: #f6f7f4;
        --card: #ffffff;
        --done: #2e9d5b;
        --progress: #e6b82f;
        --not-started: #d9544d;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 64px; }
      header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
      h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: -0.045em; line-height: 0.95; }
      .updated { color: var(--muted); font-size: 0.875rem; white-space: nowrap; }
      .summary { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px; box-shadow: 0 8px 30px rgb(23 33 29 / 6%); }
      .summary__numbers { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
      .completion { font-size: clamp(2rem, 6vw, 4rem); font-weight: 750; letter-spacing: -0.05em; line-height: 1; }
      .percentage { color: var(--muted); font-size: 1rem; font-weight: 650; }
      .progress {
        display: flex;
        width: 100%;
        height: 30px;
        overflow: hidden;
        border: 1px solid rgb(23 33 29 / 15%);
        border-radius: 999px;
        background: #eef0ee;
      }
      .progress__segment { min-width: 0; transition: width 240ms ease; }
      .progress__segment--done { background: var(--done); }
      .progress__segment--in-progress { background: var(--progress); }
      .progress__segment--not-started { background: var(--not-started); }
      .legend { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 18px; color: var(--muted); font-size: 0.9rem; }
      .legend__item { display: inline-flex; align-items: center; gap: 8px; }
      .legend__swatch { width: 10px; height: 10px; border-radius: 50%; }
      .legend__swatch--done { background: var(--done); }
      .legend__swatch--in-progress { background: var(--progress); }
      .legend__swatch--not-started { background: var(--not-started); }
      .legend strong { color: var(--ink); }
      .controls { display: grid; grid-template-columns: 1fr auto; gap: 12px; margin: 28px 0 12px; }
      input, select {
        min-height: 46px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        color: var(--ink);
        font: inherit;
        padding: 0 14px;
      }
      input:focus, select:focus { outline: 3px solid rgb(46 157 91 / 25%); border-color: var(--done); }
      .list-meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.82rem; margin: 0 2px 8px; }
      .routes { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
      .route {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(130px, 0.35fr) auto;
        align-items: center;
        gap: 16px;
        min-height: 50px;
        padding: 10px 14px 10px 16px;
        border: 1px solid var(--line);
        border-left-width: 5px;
        border-radius: 10px;
        background: var(--card);
      }
      .route--done { border-left-color: var(--done); }
      .route--in-progress { border-left-color: var(--progress); }
      .route--not-started { border-left-color: var(--not-started); }
      .route code { overflow: hidden; font-size: 0.88rem; text-overflow: ellipsis; white-space: nowrap; }
      .route__family { color: var(--muted); font-size: 0.78rem; text-transform: capitalize; }
      .route__status { border-radius: 999px; background: #eef0ee; padding: 5px 9px; font-size: 0.75rem; font-weight: 700; white-space: nowrap; }
      .error { margin: 16px 0; border: 1px solid var(--not-started); border-radius: 10px; background: #fff2f1; color: #8f2721; padding: 12px 14px; }

      @media (max-width: 680px) {
        main { width: min(100% - 20px, 1080px); padding-top: 28px; }
        header { align-items: start; flex-direction: column; gap: 8px; }
        .summary { padding: 18px; }
        .summary__numbers { align-items: start; flex-direction: column; gap: 5px; }
        .controls { grid-template-columns: 1fr; }
        .route { grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; }
        .route__family { grid-column: 1; grid-row: 2; }
        .route__status { grid-column: 2; grid-row: 1 / span 2; }
      }

      @media (prefers-reduced-motion: reduce) {
        .progress__segment { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>EHF route progress</h1>
        <span class="updated" id="updated-at">Loading…</span>
      </header>

      <section class="summary" aria-label="Route completion">
        <div class="summary__numbers">
          <strong class="completion" id="completion">— / —</strong>
          <span class="percentage" id="percentage">Loading progress…</span>
        </div>
        <div class="progress" role="img" id="progress-bar" aria-label="Route completion progress">
          <span class="progress__segment progress__segment--done" id="done-segment"></span>
          <span class="progress__segment progress__segment--in-progress" id="in-progress-segment"></span>
          <span class="progress__segment progress__segment--not-started" id="not-started-segment"></span>
        </div>
        <div class="legend" aria-hidden="true">
          <span class="legend__item"><span class="legend__swatch legend__swatch--done"></span>Done <strong id="done-count">0</strong></span>
          <span class="legend__item"><span class="legend__swatch legend__swatch--in-progress"></span>In progress <strong id="in-progress-count">0</strong></span>
          <span class="legend__item"><span class="legend__swatch legend__swatch--not-started"></span>Not yet started <strong id="not-started-count">0</strong></span>
        </div>
      </section>

      <p class="error" id="error" role="alert" hidden></p>

      <div class="controls">
        <label>
          <span hidden>Search routes</span>
          <input id="route-search" type="search" placeholder="Search routes or families" />
        </label>
        <label>
          <span hidden>Filter by status</span>
          <select id="status-filter">
            <option value="all">All statuses</option>
            <option value="done">Done</option>
            <option value="in-progress">In progress</option>
            <option value="not-started">Not yet started</option>
          </select>
        </label>
      </div>
      <div class="list-meta"><span id="visible-count">0 routes shown</span><span>Refreshes every minute</span></div>
      <ul class="routes" id="route-list"></ul>
    </main>
    <script type="module" src="/progress.mjs"></script>
  </body>
</html>
